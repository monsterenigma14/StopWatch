<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Neon Stopwatch</title>
  <style>
    body {
      margin: 0;
      font-family: 'Orbitron', sans-serif;
      background: #0f0f0f;
      color: #00ffe7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    h1 {
      font-size: 3rem;
      text-shadow: 0 0 10px #00ffe7, 0 0 20px #00ffe7;
    }

    #display {
      font-size: 4rem;
      margin: 20px 0;
      text-shadow: 0 0 10px #00ffe7, 0 0 20px #00ffe7;
    }

    .buttons {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      background: transparent;
      border: 2px solid #00ffe7;
      color: #00ffe7;
      padding: 12px 24px;
      font-size: 1rem;
      cursor: pointer;
      border-radius: 12px;
      transition: 0.2s;
      box-shadow: 0 0 5px #00ffe7;
    }

    button:hover {
      background-color: #00ffe7;
      color: #000;
      box-shadow: 0 0 20px #00ffe7;
    }

    #laps {
      margin-top: 30px;
      max-height: 150px;
      overflow-y: auto;
      width: 300px;
      text-align: left;
    }

    .lap {
      border-bottom: 1px dashed #00ffe7;
      padding: 5px 0;
      font-size: 1rem;
    }

    .controls {
      margin-top: 10px;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
</head>
<body>

  <h1>Neon Stopwatch</h1>
  <div id="display">00:00:00</div>

  <div class="buttons">
    <button onclick="start()">Start</button>
    <button onclick="pause()">Pause</button>
    <button onclick="reset()">Reset</button>
    <button onclick="lap()">Lap</button>
  </div>

  <div id="laps"></div>

  <script>
    let startTime = 0;
    let elapsedTime = 0;
    let timerInterval;
    let lapCount = 0;

    function timeToString(time) {
      const hrs = Math.floor(time / 3600000);
      const mins = Math.floor((time % 3600000) / 60000);
      const secs = Math.floor((time % 60000) / 1000);
      return (
        (hrs < 10 ? "0" + hrs : hrs) + ":" +
        (mins < 10 ? "0" + mins : mins) + ":" +
        (secs < 10 ? "0" + secs : secs)
      );
    }

    function print(txt) {
      document.getElementById("display").innerHTML = txt;
    }

    function start() {
      if (!timerInterval) {
        startTime = Date.now() - elapsedTime;
        timerInterval = setInterval(function () {
          elapsedTime = Date.now() - startTime;
          print(timeToString(elapsedTime));
        }, 1000);
      }
    }

    function pause() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    function reset() {
      clearInterval(timerInterval);
      timerInterval = null;
      elapsedTime = 0;
      lapCount = 0;
      print("00:00:00");
      document.getElementById("laps").innerHTML = "";
    }

    function lap() {
      if (timerInterval) {
        const lapTime = timeToString(elapsedTime);
        const lapDiv = document.createElement("div");
        lapDiv.className = "lap";
        lapDiv.textContent = `Lap ${++lapCount}: ${lapTime}`;
        document.getElementById("laps").prepend(lapDiv);
      }
    }
  </script>
</body>
</html>
